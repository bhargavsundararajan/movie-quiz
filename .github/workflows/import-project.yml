name: Import uploaded project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path.cwd().resolve()
          archives = sorted(root.glob('movie-quiz-import-*.zip'))
          if len(archives) != 2:
              raise SystemExit('Expected two import archives')
          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if not (root / name).resolve().is_relative_to(root):
                          raise SystemExit('Unsafe archive path')
                  z.extractall(root)
              archive.unlink()
          PY
      - name: Check game logic
        run: npm test
      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import original movie quiz project'
          git push
